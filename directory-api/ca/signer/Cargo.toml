[package]
name = "ca-signer"
version = "0.1.0"
edition = "2021"
description = "CA VM signer: pulls jobs from RDS over mTLS, applies its own policy, signs passports"

[dependencies]
rdc-passport = { path = "../passport" }
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "signal"] }
zeroize = "1"

[profile.release]
lto = "thin"
strip = true
